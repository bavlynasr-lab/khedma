<style>
/* Layout: mobile-first app shell — header with logo + Coptic date, one scrolling view, fixed bottom nav. */
:root{
  --bg:#FAF6F5; --surface:#FFFFFF; --ink:#2A1A1C; --muted:#7A6769; --line:#ECE2E0;
  --accent:#7B1E2B; --accent-ink:#FFFFFF; --soft:#F5E8E9; --gold:#A8833A;
  --ok:#2E7D5B; --ok-bg:#E6F3EC; --watch:#A86A12; --watch-bg:#FBF0DD; --risk:#B8322A; --risk-bg:#FBE6E3;
  --display:"Amiri", "Noto Naskh Arabic", serif;
  --body:"IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#161112; --surface:#211A1B; --ink:#F2E8E6; --muted:#A8979A; --line:#372C2E;
  --accent:#E08594; --accent-ink:#1A0E10; --soft:#3A2327; --gold:#D6B46C;
  --ok:#62C495; --ok-bg:#163126; --watch:#E5B357; --watch-bg:#3A2C12; --risk:#F27C6E; --risk-bg:#3D1C19; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161112; --surface:#211A1B; --ink:#F2E8E6; --muted:#A8979A; --line:#372C2E;
  --accent:#E08594; --accent-ink:#1A0E10; --soft:#3A2327; --gold:#D6B46C;
  --ok:#62C495; --ok-bg:#163126; --watch:#E5B357; --watch-bg:#3A2C12; --risk:#F27C6E; --risk-bg:#3D1C19; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;direction:rtl}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:0 110px}
header.top{display:flex;align-items:center;gap:12px;padding-block:16px 12px}
.logo{width:52px;height:52px;border-radius:50%;flex:none;background:var(--soft);display:grid;place-items:center;overflow:hidden;border:2px solid var(--gold)}
.logo img{width:100%;height:100%;object-fit:cover}
.logo svg{width:30px;height:30px}
.top h1{font-family:var(--display);font-size:24px;line-height:1.2;margin:0;text-wrap:balance}
.top .sub{color:var(--muted);font-size:13px}
.top .sub b{color:var(--gold);font-weight:600}
h2{font-size:17px;margin:22px 0 10px;font-weight:700}
h3{font-size:14px;margin:0 0 8px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}

.banner{background:var(--soft);border-radius:var(--r);padding:12px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px;margin-block:4px 8px}
.banner p{margin:0;flex:1 1 220px}

.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:560px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;text-align:start;cursor:pointer}
.kpi .v{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi .l{font-size:13px;color:var(--muted)}
.kpi.risk .v{color:var(--risk)} .kpi.watch .v{color:var(--watch)}

.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line);width:100%;background:none;border-inline:0;border-top:0;text-align:start;cursor:pointer}
.row:last-child{border-bottom:0}
.row .main{flex:1;min-width:0}
.row .name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .meta{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;background:var(--soft);color:var(--accent)}
.empty{padding:22px 16px;text-align:center;color:var(--muted)}

.pill{font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap;flex:none}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.watch{background:var(--watch-bg);color:var(--watch)}
.pill.risk{background:var(--risk-bg);color:var(--risk)}
.pill.new{background:var(--soft);color:var(--muted)}
.pill.done{background:var(--ok-bg);color:var(--ok)}

.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:600;cursor:pointer;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;gap:6px;justify-content:center;text-decoration:none}
.btn.ghost{background:var(--soft);color:var(--accent)}
.btn.line{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--risk-bg);color:var(--risk)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btn:focus-visible,.row:focus-visible,.chip:focus-visible,.kpi:focus-visible,.nav button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btns{display:flex;gap:8px;flex-wrap:wrap}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-block:8px 10px}
.search{flex:1 1 200px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 12px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-bottom:10px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.att-row .tick{width:28px;height:28px;border-radius:8px;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.att-row.on .tick{background:var(--ok);border-color:var(--ok);color:#fff}
.att-row.on .tick::after{content:"✓";font-weight:700}
.att-sum{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.att-sum .big{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}

.bars{display:flex;align-items:flex-end;gap:6px;height:90px;padding:10px 14px 0}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bar i{display:block;width:100%;max-width:34px;background:var(--accent);opacity:.85;border-radius:6px 6px 2px 2px;min-height:3px}
.bar:last-child i{opacity:1;background:var(--gold)}
.bar span{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar-l{display:flex;gap:6px;padding:4px 14px 10px}
.bar-l span{flex:1;text-align:center;font-size:11px;color:var(--muted)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.stack{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.stack>*{min-width:0}
.prof-head{display:flex;gap:12px;align-items:center}
.prof-head .av{width:56px;height:56px;font-size:22px}
.prof-head h2{margin:0;font-size:21px}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dot{width:22px;height:22px;border-radius:6px;background:var(--risk-bg);border:1px solid var(--risk)}
.dot.p{background:var(--ok);border-color:var(--ok)}
.phone{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.phone .n{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;user-select:all}
.visit{border-top:1px solid var(--line);padding-top:8px;margin-top:8px}
.visit:first-child{border-top:0;margin-top:0;padding-top:0}

form.f{display:grid;gap:14px}
fieldset{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin:0;background:var(--surface);display:grid;gap:10px}
legend{font-weight:700;padding-inline:6px;font-size:14px;color:var(--accent)}
label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
input,select,textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 11px;font-size:15px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.two{grid-template-columns:1fr}}
.check{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:14px}
.check input{width:20px;height:20px}

.fab{position:fixed;inset-inline-start:auto;inset-inline-end:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));border-radius:999px;padding:12px 18px;box-shadow:0 6px 18px rgba(0,0,0,.18);z-index:5}

.nav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
.nav .in{display:flex;max-width:720px;width:100%}
.nav button{flex:1;background:none;border:0;padding:8px 2px 9px;display:grid;justify-items:center;gap:2px;font-size:12px;color:var(--muted);cursor:pointer}
.nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--accent);font-weight:700}
.nav .badge{position:relative}
.nav .badge b{position:absolute;top:-4px;inset-inline-end:-10px;background:var(--risk);color:#fff;font-size:10px;border-radius:999px;padding:0 5px;line-height:16px}

.sheet-bg{position:fixed;inset:0;background:rgba(20,10,12,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h2{margin-top:0}
.toast{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:12px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
.back{background:none;border:0;color:var(--accent);font-weight:600;padding:8px 0;cursor:pointer}
.tbl{overflow-x:auto}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}
.logo img{width:100%;height:100%;object-fit:cover}
.gate{min-height:60vh;display:grid;place-content:center;justify-items:center;text-align:center;gap:6px;padding-block:24px}
.gate h2{font-family:var(--display);font-size:26px;margin:8px 0 0}
.gate p{margin:0;max-width:34ch}
.gate .btn{margin-top:10px;min-width:200px}
.logo.big{width:120px;height:120px;border-width:3px}
body:not(.in) .nav{display:none}
</style>

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const todayISO=()=>iso(new Date());
function fmtDate(s,opt){try{return parse(s).toLocaleDateString('ar-EG',opt||{weekday:'long',day:'numeric',month:'long'})}catch(e){return s}}
const shortDate=s=>{const d=parse(s);return d.getDate()+'/'+(d.getMonth()+1)};
function coptic(d){
  const y=d.getFullYear(),m=d.getMonth()+1,dd=d.getDate();
  const a=Math.floor((14-m)/12),y2=y+4800-a,m2=m+12*a-3;
  const j=dd+Math.floor((153*m2+2)/5)+365*y2+Math.floor(y2/4)-Math.floor(y2/100)+Math.floor(y2/400)-32045;
  const E=1825030,yr=Math.floor((4*(j-E)+1463)/1461),st=E+365*(yr-1)+Math.floor(yr/4);
  const mo=Math.floor((j-st)/30)+1,day=j-st-30*(mo-1)+1;
  return day+' '+COPTIC[mo-1]+' '+yr+' ش';
}
function waNum(p){let d=String(p||'').replace(/\D/g,'');if(!d)return '';if(d.startsWith('00'))d=d.slice(2);if(d.startsWith('0'))d='20'+d.slice(1);else if(d.length===10&&d[0]==='1')d='20'+d;return d}

/* ---------- derived ---------- */
function sessionDates(){return Object.keys(S.sessions).sort()}
function kidStats(k){
  const dates=sessionDates().filter(d=>d>=(k.createdAt||'0')||S.sessions[d].includes(k.id));
  let streak=0;for(let i=dates.length-1;i>=0;i--){if(S.sessions[dates[i]].includes(k.id))break;streak++}
  const present=dates.filter(d=>S.sessions[d].includes(k.id));
  const recent=dates.slice(-12);const pr=recent.filter(d=>S.sessions[d].includes(k.id)).length;
  const streakStart=streak?dates[dates.length-streak]:null;
  const visited=streak?S.visits.some(v=>v.kidId===k.id&&v.date>=streakStart):false;
  const th=+S.settings.threshold||2;
  const status=!dates.length?'new':streak>=th?'risk':streak>=1?'watch':'ok';
  return{dates,streak,last:present[present.length-1]||null,rate:recent.length?Math.round(pr/recent.length*100):null,status,needsVisit:streak>=1&&!visited};
}

const kidById=id=>S.kids.find(k=>k.id===id);

function logoHTML(){return '<img alt="لوجو الكنيسة" src="'+(S.settings.logo||DEFAULT_LOGO)+'">'}
function renderShell(){

let after=null,pending=false;
function render(){

function scheduleRender(){
  if(!me.user)return;
  const a=document.activeElement;
  if(ui.view==='kidEdit'||$('#sheetRoot').innerHTML||(a&&a.matches&&a.matches('input:not([type=search]),textarea,select'))){pending=true;return}
  render();
}
document.addEventListener('focusout',()=>setTimeout(()=>{if(pending&&ui.view!=='kidEdit'&&!$('#sheetRoot').innerHTML){const a=document.activeElement;if(!(a&&a.matches&&a.matches('input,textarea,select')))render()}},300));
function go(v,extra){Object.assign(ui,{view:v},extra||{});render();window.scrollTo(0,0)}
function screen(html){document.body.classList.remove('in');$('#nav').innerHTML='';$('#app').innerHTML=html;$('#logo').innerHTML=logoHTML()}

/* "my kids" scope: servants see everyone but default to their own */
function visibleKids(){return S.kids}

/* ---------- views ---------- */
function home(){
  const mine=me.servantId&&!me.isOwner;
  const stats=S.kids.map(k=>({k,s:kidStats(k)}));
  const dates=sessionDates();const last=dates[dates.length-1];
  const lastCount=last?S.sessions[last].length:0;
  const risk=stats.filter(x=>x.s.status==='risk');
  let need=stats.filter(x=>x.s.needsVisit).sort((a,b)=>b.s.streak-a.s.streak);
  let h='';
  if(!S.kids.length&&me.isOwner)h+='<div class="banner"><p><b>أهلاً!</b> ابدأ بإضافة الخدام (بإيميلاتهم عشان يقدروا يدخلوا)، وبعدين الأولاد. لو كنت مسجل داتا في النسخة القديمة استرجعها من "المزيد".</p><button class="btn sm" data-go="servants">ضيف الخدام</button></div>';
  h+='<div class="kpis">'+
    '<button class="kpi" data-go="kids"><div class="v">'+S.kids.length+'</div><div class="l">ولد وبنت في الفصل</div></button>'+
    '<button class="kpi" data-go="attend"><div class="v">'+(last?lastCount+'<span class="muted small"> / '+S.kids.length+'</span>':'—')+'</div><div class="l">'+(last?'حضور '+esc(fmtDate(last,{day:'numeric',month:'long'})):'لسه مفيش حضور')+'</div></button>'+
    '<button class="kpi risk" data-filter="risk"><div class="v">'+risk.length+'</div><div class="l">هاي ريسك</div></button>'+
    '<button class="kpi watch" data-filter="need"><div class="v">'+need.length+'</div><div class="l">محتاجين افتقاد</div></button></div>';
  if(mine){
    const myNeed=need.filter(x=>x.k.servantId===me.servantId);
    h+='<h2>افتقادك الأسبوع ده</h2><div class="list">'+(myNeed.length?myNeed.map(rowNeed).join(''):'<div class="empty">كل أولادك اتفقدوا. ربنا يعوض تعبك.</div>')+'</div>';
    need=need.filter(x=>x.k.servantId!==me.servantId);
    if(need.length)h+='<h2>باقي الفصل</h2>';
  }else h+='<h2>محتاجين افتقاد</h2>';
  if(!need.length&&!mine)h+='<div class="list"><div class="empty">كله اتفقد. ربنا يبارك تعبكم.</div></div>';
  else if(need.length){
    const groups={};need.forEach(x=>{const g=x.k.servantId||'';(groups[g]=groups[g]||[]).push(x)});
    h+='<div class="stack">'+Object.keys(groups).map(g=>{
      const sv=S.servants.find(s=>s.id===g);
      return '<div><div class="toolbar" style="margin:0 0 6px"><h3 style="margin:0;flex:1">'+(sv?'مع '+esc(sv.name):'من غير خادم مسؤول')+' · '+groups[g].length+'</h3>'+(sv&&sv.phone?'<a class="btn sm ghost" target="_blank" rel="noopener" href="'+waLink(sv.phone,visitMsg(sv))+'">ابعت له القايمة</a>':'')+'</div><div class="list">'+groups[g].map(rowNeed).join('')+'</div></div>'
    }).join('')+'</div>';
  }
  const ld=dates.slice(-8);
  if(ld.length){
    const max=Math.max(S.kids.length,1);
    h+='<h2>الحضور في آخر '+ld.length+' خدمات</h2><div class="list"><div class="bars">'+ld.map(d=>{const c=S.sessions[d].length;return '<div class="bar"><span>'+c+'</span><i style="height:'+Math.max(3,Math.round(c/max*62))+'px"></i></div>'}).join('')+'</div><div class="bar-l">'+ld.map(d=>'<span>'+shortDate(d)+'</span>').join('')+'</div></div>';
  }
  const bd=upcomingBirthdays();
  if(bd.length)h+='<h2>أعياد ميلاد قريبة</h2><div class="list">'+bd.map(({k,days,date})=>'<div class="row" data-kid="'+k.id+'" tabindex="0"><div class="av">'+esc(initial(k.name))+'</div><div class="main"><div class="name">'+esc(k.name)+'</div><div class="meta">'+esc(fmtDate(date,{day:'numeric',month:'long'}))+'</div></div><span class="pill new">'+(days===0?'النهارده':'بعد '+days+' يوم')+'</span></div>').join('')+'</div>';
  return h;
}
function rowNeed({k,s}){return '<div class="row" data-kid="'+k.id+'" tabindex="0"><div class="av">'+esc(initial(k.name))+'</div><div class="main"><div class="name">'+esc(k.name)+'</div><div class="meta">غايب '+s.streak+' مرة · '+(s.last?'آخر حضور '+esc(fmtDate(s.last,{day:'numeric',month:'short'})):'ماحضرش لسه')+'</div></div>'+pill(s)+'<button class="btn sm ghost" data-visit="'+k.id+'">سجّل</button></div>'}
function upcomingBirthdays(){
  const t=parse(todayISO());const out=[];
  S.kids.forEach(k=>{if(!k.birth)return;const b=parse(k.birth);let n=new Date(t.getFullYear(),b.getMonth(),b.getDate());if(n<t)n.setFullYear(t.getFullYear()+1);const days=Math.round((n-t)/864e5);if(days<=30)out.push({k,days,date:iso(n)})});
  return out.sort((a,b)=>a.days-b.days);
}
function waLink(phone,text){return 'https://wa.me/'+waNum(phone)+(text?'?text='+encodeURIComponent(text):'')}
function visitMsg(sv){
  const list=S.kids.filter(k=>k.servantId===sv.id).map(k=>({k,s:kidStats(k)})).filter(x=>x.s.needsVisit);
  return 'سلام يا '+sv.name+'، دي قايمة افتقاد الأسبوع:\n'+list.map(({k,s})=>'- '+k.name+' (غايب '+s.streak+(s.streak>1?' مرات':' مرة')+')'+(k.motherPhone||k.fatherPhone?' — '+(k.motherPhone||k.fatherPhone):'')).join('\n')+'\nسجّل الافتقاد على الموقع بعد ما تكلمهم. ربنا يعوضك.';
}

function attend(){
  if(!ui.attDate)ui.attDate=lastServiceDate();
  const d=ui.attDate;const has=!!S.sessions[d];const present=has?S.sessions[d]:[];
  const kids=[...S.kids].sort((a,b)=>a.name.localeCompare(b.name,'ar'));
  let h='<div class="card"><div class="toolbar" style="margin:0 0 8px"><label style="flex:1 1 180px">يوم الخدمة<input type="date" id="attDate" value="'+d+'"></label></div>'+
    '<div class="att-sum"><span class="big" id="attCount">'+present.length+'</span><span class="muted">حاضر من '+S.kids.length+' · '+esc(fmtDate(d))+' · '+coptic(parse(d))+'</span></div>'+
    (has?'<div class="small muted">أي خادم يقدر يعلّم في نفس الوقت، والعدد بيتحدث لوحده.</div>':'<div class="small muted">لسه ما اتسجلش حضور اليوم ده. دوس على أي اسم يتسجل.</div>')+'</div>';
  h+='<div class="toolbar"><input class="search" id="attSearch" type="search" placeholder="دوّر على اسم…" value="'+esc(ui.q)+'"></div>';
  if(!kids.length)return h+'<div class="list"><div class="empty">ضيف الأولاد الأول من صفحة الأولاد.</div></div>';
  h+='<div class="list" id="attList">'+kids.map(k=>{const on=present.includes(k.id);return '<button class="row att-row'+(on?' on':'')+'" data-att="'+k.id+'" data-name="'+esc(k.name)+'" aria-pressed="'+on+'"><span class="tick"></span><span class="main"><span class="name" style="display:block">'+esc(k.name)+'</span><span class="meta" style="display:block">سنة '+gradeTxt(k.grade)+(k.servantId?' · '+esc(servantName(k.servantId)):'')+'</span></span></button>'}).join('')+'</div>';
  if(has)h+='<div class="btns" style="margin-top:14px"><button class="btn sm line" data-act="allPresent">علّم الكل حاضر</button>'+(me.isOwner?'<button class="btn sm danger" data-act="delSession">امسح حضور اليوم ده</button>':'')+'</div>';
  after=()=>{$('#attDate').onchange=e=>{if(e.target.value){ui.attDate=e.target.value;render()}};bindSearch('#attSearch','#attList')};
  return h;
}
function bindSearch(inp,list){const i=$(inp);if(!i)return;const f=()=>{ui.q=i.value.trim();const q=ui.q;document.querySelectorAll(list+' [data-name]').forEach(r=>{r.hidden=!!q&&!r.dataset.name.includes(q)})};i.oninput=f;f()}

function kids(){
  if(ui.filter===null)ui.filter=(me.servantId&&!me.isOwner)?'mine':'all';
  const F=[['all','الكل']].concat(me.servantId?[['mine','أولادي']]:[]).concat([['5','خامسة'],['6','سادسة'],['risk','هاي ريسك'],['need','محتاجين افتقاد'],['none','من غير خادم']]);
  let list=S.kids.map(k=>({k,s:kidStats(k)}));
  const f=ui.filter;
  if(f==='mine')list=list.filter(x=>x.k.servantId===me.servantId);
  if(f==='5'||f==='6')list=list.filter(x=>x.k.grade===f);
  if(f==='risk')list=list.filter(x=>x.s.status==='risk');
  if(f==='need')list=list.filter(x=>x.s.needsVisit);
  if(f==='none')list=list.filter(x=>!x.k.servantId);
  const order={risk:0,watch:1,new:2,ok:3};
  list.sort((a,b)=>order[a.s.status]-order[b.s.status]||a.k.name.localeCompare(b.k.name,'ar'));
  let h='<div class="toolbar"><input class="search" id="kidSearch" type="search" placeholder="دوّر بالاسم أو المنطقة أو المدرسة…" value="'+esc(ui.q)+'"></div>';
  h+='<div class="chips">'+F.map(([v,l])=>'<button class="chip'+(f===v?' on':'')+'" data-filter="'+v+'">'+l+'</button>').join('')+'</div>';
  h+='<div class="list" id="kidList">'+(list.length?list.map(({k,s})=>'<div class="row" tabindex="0" data-kid="'+k.id+'" data-name="'+esc([k.name,k.area,k.school,servantName(k.servantId)].join(' '))+'"><div class="av">'+esc(initial(k.name))+'</div><div class="main"><div class="name">'+esc(k.name)+'</div><div class="meta">'+gradeTxt(k.grade)+' · '+(k.servantId?esc(servantName(k.servantId)):'من غير خادم')+(k.area?' · '+esc(k.area):'')+'</div></div>'+pill(s)+'</div>').join(''):'<div class="empty">'+(S.kids.length?'مفيش حد في الفلتر ده.':'لسه مفيش أولاد. دوس "ولد جديد" تحت.')+'</div>')+'</div>';
  h+='<button class="btn fab" data-act="newKid">+ ولد جديد</button>';
  after=()=>bindSearch('#kidSearch','#kidList');
  return h;
}

function phoneLine(label,num){
  if(!num)return '';
  return '<dt>'+label+'</dt><dd><div class="phone"><span class="n">'+esc(num)+'</span><button class="btn sm line" data-copy="'+esc(num)+'">نسخ</button><a class="btn sm ghost" target="_blank" rel="noopener" href="'+waLink(num)+'">واتساب</a><a class="btn sm line" href="tel:'+esc(num)+'">اتصال</a></div></dd>';
}
function kv(pairs){const r=pairs.filter(p=>p[1]).map(([a,b])=>'<dt>'+a+'</dt><dd>'+esc(b)+'</dd>').join('');return r?'<dl class="kv">'+r+'</dl>':'<div class="small muted">مفيش بيانات لسه.</div>'}
function kid(){
  const k=kidById(ui.kidId);if(!k)return kids();
  const s=kidStats(k);
  const age=k.birth?Math.floor((Date.now()-parse(k.birth))/(365.25*864e5)):null;
  const visits=S.visits.filter(v=>v.kidId===k.id).sort((a,b)=>b.date.localeCompare(a.date));
  const last10=s.dates.slice(-10);
  let h='<button class="back" data-go="kids">→ رجوع للأولاد</button><div class="stack">';
  h+='<div class="card"><div class="prof-head"><div class="av">'+esc(initial(k.name))+'</div><div style="flex:1;min-width:0"><h2>'+esc(k.name)+'</h2><div class="muted small">سنة '+gradeTxt(k.grade)+' ابتدائي'+(age!==null?' · '+age+' سنة':'')+'</div></div>'+pill(s)+'</div>'+
     '<div class="btns" style="margin-top:12px"><button class="btn sm" data-visit="'+k.id+'">سجّل افتقاد</button><button class="btn sm ghost" data-act="editKid">تعديل البيانات</button></div></div>';
  h+='<div class="card"><h3>الحضور</h3>'+(last10.length?'<div class="dots" aria-label="آخر الخدمات">'+last10.map(d=>'<span class="dot'+(S.sessions[d].includes(k.id)?' p':'')+'" title="'+esc(fmtDate(d,{day:'numeric',month:'long'}))+'"></span>').join('')+'</div><div class="small muted" style="margin-top:8px">نسبة الحضور '+(s.rate??'—')+'% · '+(s.last?'آخر حضور '+esc(fmtDate(s.last,{day:'numeric',month:'long'})):'ماحضرش لسه')+(s.streak?' · غايب '+s.streak+' مرة ورا بعض':'')+'</div>':'<div class="small muted">لسه مفيش حضور متسجل.</div>')+'</div>';
  h+='<div class="card"><h3>الخادم المسؤول</h3><select id="kidServant"><option value="">— من غير خادم —</option>'+S.servants.map(sv=>'<option value="'+sv.id+'"'+(sv.id===k.servantId?' selected':'')+'>'+esc(sv.name)+'</option>').join('')+'</select></div>';
  h+='<div class="card"><h3>سجل الافتقاد</h3>'+(visits.length?visits.map(v=>'<div class="visit"><div class="toolbar" style="margin:0"><b style="flex:1">'+esc(v.type)+' · '+esc(fmtDate(v.date,{day:'numeric',month:'long'}))+'</b>'+(me.isOwner||v.by===me.user.email?'<button class="btn sm line" data-delvisit="'+v.id+'">مسح</button>':'')+'</div><div class="small muted">'+esc(v.servantId?servantName(v.servantId):(v.byName||''))+'</div>'+(v.note?'<div>'+esc(v.note)+'</div>':'')+'</div>').join(''):'<div class="small muted">لسه مفيش افتقاد متسجل.</div>')+'</div>';
  h+='<div class="card"><h3>الأهل والتليفونات</h3><dl class="kv">'+(k.fatherName?'<dt>الأب</dt><dd>'+esc(k.fatherName)+'</dd>':'')+phoneLine('تليفون الأب',k.fatherPhone)+(k.motherName?'<dt>الأم</dt><dd>'+esc(k.motherName)+'</dd>':'')+phoneLine('تليفون الأم',k.motherPhone)+phoneLine('تليفون الولد',k.phone)+'</dl>'+(!k.fatherPhone&&!k.motherPhone&&!k.phone?'<div class="small muted">مفيش أرقام لسه.</div>':'')+'</div>';
  h+='<div class="card"><h3>العنوان</h3>'+kv([['المنطقة',k.area],['العنوان',k.address],['علامة مميزة',k.landmark]])+'</div>';
  h+='<div class="card"><h3>المدرسة</h3>'+kv([['المدرسة',k.school],['الفصل',k.schoolClass]])+'</div>';
  h+='<div class="card"><h3>بيانات تانية</h3>'+kv([['تاريخ الميلاد',k.birth?fmtDate(k.birth,{day:'numeric',month:'long',year:'numeric'}):''],['أب الاعتراف',k.confessor],['ملاحظات',k.notes]])+'</div>';
  h+='<div class="card"><h3>هدية العيد</h3>'+kv([['المقاس',k.giftSize],['يحب إيه / ملاحظات',k.giftNotes]])+'<label class="check" style="margin-top:10px"><input type="checkbox" id="giftDone"'+(k.giftDone?' checked':'')+'> الهدية اتسلمت</label></div>';
  if(me.isOwner)h+='<button class="btn danger" data-act="delKid">امسح الولد ده</button>';

  after=()=>{

    $('#giftDone').onchange=e=>{updateDoc(doc(db,'kids',k.id),{giftDone:e.target.checked}).catch(fail);e.target.blur()};

}

const KID_FIELDS=['name','grade','birth','servantId','fatherName','fatherPhone','motherName','motherPhone','phone','area','address','landmark','school','schoolClass','giftSize','giftNotes','confessor','notes'];

  h+='<fieldset><legend>الأساسي</legend>'+inp('name','الاسم بالكامل *')+'<div class="two"><label>السنة<select id="f_grade"><option value="5"'+(k.grade==='5'?' selected':'')+'>خامسة ابتدائي</option><option value="6"'+(k.grade==='6'?' selected':'')+'>سادسة ابتدائي</option></select></label>'+inp('birth','تاريخ الميلاد','date')+'</div>'+

  h+='<fieldset><legend>العنوان</legend>'+inp('area','المنطقة','text','مثلاً: شبرا - الترعة')+inp('address','العنوان بالتفصيل','text','الشارع، رقم العمارة، الدور، الشقة')+inp('landmark','علامة مميزة','text','جنب صيدلية…')+'</fieldset>';
  h+='<fieldset><legend>المدرسة</legend><div class="two">'+inp('school','اسم المدرسة')+inp('schoolClass','الفصل')+'</div></fieldset>';
  h+='<fieldset><legend>هدية العيد</legend><div class="two">'+inp('giftSize','المقاس')+inp('giftNotes','بيحب إيه')+'</div></fieldset>';
  h+='<fieldset><legend>تاني</legend>'+inp('confessor','أب الاعتراف')+'<label>ملاحظات<textarea id="f_notes" rows="3">'+esc(k.notes||'')+'</textarea></label></fieldset>';
  h+='<button class="btn block" type="submit" id="kidSubmit">'+(isNew?'ضيف الولد':'احفظ التعديل')+'</button></form>';
  after=()=>{$('#kidForm').onsubmit=e=>{e.preventDefault();
    const o={};KID_FIELDS.forEach(f=>{const el=$('#f_'+f);o[f]=el?el.value.trim():''});
    if(!o.name){toast('اكتب اسم الولد');$('#f_name').focus();return}
    o.updatedBy=me.user.email;

    toast(isNew?'اتضاف '+o.name:'اتحفظ');

  return h;

function servants(){
  let h='<h2 style="margin-top:6px">الخدام</h2>';
  h+='<div class="list">'+(S.servants.length?S.servants.map(sv=>{const ks=S.kids.filter(k=>k.servantId===sv.id);const need=ks.filter(k=>kidStats(k).needsVisit).length;
    return '<div class="row" tabindex="0" data-servant="'+sv.id+'"><div class="av">'+esc(initial(sv.name))+'</div><div class="main"><div class="name">'+esc(sv.name)+(sv.id===me.servantId?' <span class="muted small">(أنت)</span>':'')+'</div><div class="meta">مسؤول عن '+ks.length+(need?' · '+need+' محتاجين افتقاد':'')+(sv.email?' · له دخول':' · من غير دخول')+'</div></div>'+(need?'<span class="pill watch">'+need+'</span>':'<span class="pill ok">تمام</span>')+'</div>'}).join(''):'<div class="empty">'+(me.isOwner?'ضيف الخدام اللي معاك في الفصل.':'المسؤول لسه ماضافش الخدام.')+'</div>')+'</div>';
  if(me.isOwner){
    h+='<div class="card" style="margin-top:14px"><h3>خادم جديد</h3><form id="svForm" class="f" style="gap:10px"><div class="two"><input id="svName" placeholder="الاسم" required><input id="svPhone" placeholder="التليفون" inputmode="tel" dir="ltr"></div><input id="svEmail" type="email" dir="ltr" placeholder="إيميل جوجل بتاعه (Gmail) عشان يقدر يدخل"><button class="btn" type="submit">ضيف</button></form><div class="small muted" style="margin-top:8px">أي حد إيميله متسجل هنا يقدر يدخل الموقع ويشوف ويملا البيانات. اللي من غير إيميل بيتسجل بس عشان توزّع عليه أولاد.</div></div>';
    const un=S.kids.filter(k=>!k.servantId).length;
    if(S.servants.length&&un)h+='<div class="banner" style="margin-top:14px"><p>فيه <b>'+un+'</b> من غير خادم مسؤول.</p><button class="btn sm" data-act="autoAssign">وزّعهم بالتساوي</button></div>';
  }
  after=()=>{const f=$('#svForm');if(f)f.onsubmit=e=>{e.preventDefault();const n=$('#svName').value.trim();if(!n)return;
    const id=newId('servants');const email=low($('#svEmail').value);
    if(email&&S.servants.some(s=>s.email===email)){toast('الإيميل ده متسجل لخادم تاني');return}
    const b=writeBatch(db);b.set(doc(db,'servants',id),{name:n,phone:$('#svPhone').value.trim(),email});if(email)b.set(doc(db,'members',email),{servantId:id,name:n});
    b.commit().then(()=>toast('اتضاف '+n),fail);f.reset();$('#svName').blur()}};
  return h;
}
function servant(){
  const sv=S.servants.find(s=>s.id===ui.servantId);if(!sv)return servants();
  const ks=S.kids.filter(k=>k.servantId===sv.id).map(k=>({k,s:kidStats(k)}));
  const others=S.kids.filter(k=>k.servantId!==sv.id);
  let h='<button class="back" data-go="servants">→ رجوع للخدام</button><div class="stack">';
  h+='<div class="card"><div class="prof-head"><div class="av">'+esc(initial(sv.name))+'</div><div style="flex:1;min-width:0"><h2>'+esc(sv.name)+'</h2><div class="small muted">مسؤول عن '+ks.length+(sv.email?' · <span dir="ltr">'+esc(sv.email)+'</span>':'')+'</div></div></div>'+(sv.phone?'<dl class="kv" style="margin-top:10px">'+phoneLine('التليفون',sv.phone)+'</dl>':'')+
     (sv.phone&&ks.some(x=>x.s.needsVisit)?'<a class="btn block" style="margin-top:10px" target="_blank" rel="noopener" href="'+waLink(sv.phone,visitMsg(sv))+'">ابعت له قايمة الافتقاد على واتساب</a>':'')+'</div>';
  if(me.isOwner)h+='<div class="card"><h3>تعديل</h3><form id="svEdit" class="f" style="gap:10px"><div class="two"><input id="sveName" value="'+esc(sv.name)+'"><input id="svePhone" value="'+esc(sv.phone||'')+'" inputmode="tel" dir="ltr" placeholder="التليفون"></div><input id="sveEmail" type="email" dir="ltr" value="'+esc(sv.email||'')+'" placeholder="إيميل جوجل للدخول"><button class="btn sm" type="submit">احفظ</button></form></div>';
  h+='<div><h3>الأولاد اللي معاه</h3><div class="list">'+(ks.length?ks.map(({k,s})=>'<div class="row" data-kid="'+k.id+'" tabindex="0"><div class="av">'+esc(initial(k.name))+'</div><div class="main"><div class="name">'+esc(k.name)+'</div><div class="meta">'+gradeTxt(k.grade)+'</div></div>'+pill(s)+'<button class="btn sm line" data-unassign="'+k.id+'">شيل</button></div>').join(''):'<div class="empty">مفيش أولاد معاه لسه.</div>')+'</div></div>';
  if(others.length)h+='<div class="card"><h3>ضيف ولد ليه</h3><div class="toolbar" style="margin:0"><select id="addKid" style="flex:1 1 200px"><option value="">اختار…</option>'+others.map(k=>'<option value="'+k.id+'">'+esc(k.name)+(k.servantId?' (مع '+esc(servantName(k.servantId))+')':'')+'</option>').join('')+'</select><button class="btn sm" data-act="assignKid">ضيف</button></div></div>';
  if(me.isOwner)h+='<button class="btn danger" data-act="delServant">امسح الخادم</button>';
  h+='</div>';
  after=()=>{const f=$('#svEdit');if(f)f.onsubmit=e=>{e.preventDefault();
    const email=low($('#sveEmail').value);
    if(email&&S.servants.some(s=>s.email===email&&s.id!==sv.id)){toast('الإيميل ده متسجل لخادم تاني');return}
    const name=$('#sveName').value.trim()||sv.name;const b=writeBatch(db);
    b.update(doc(db,'servants',sv.id),{name,phone:$('#svePhone').value.trim(),email});
    if(sv.email&&sv.email!==email)b.delete(doc(db,'members',sv.email));
    if(email)b.set(doc(db,'members',email),{servantId:sv.id,name});
    b.commit().then(()=>toast('اتحفظ'),fail);document.activeElement.blur()}};
  return h;
}

function gifts(){
  const all=[...S.kids].sort((a,b)=>a.name.localeCompare(b.name,'ar'));
  const done=all.filter(k=>k.giftDone).length;
  const list=ui.giftFilter==='pending'?all.filter(k=>!k.giftDone):all;
  let h='<button class="back" data-go="more">→ رجوع</button><h2 style="margin-top:4px">هدايا العيد</h2>';
  h+='<div class="card att-sum"><span class="big">'+done+'</span><span class="muted">اتسلمت من '+all.length+'</span></div>';
  h+='<div class="chips" style="margin-top:10px"><button class="chip'+(ui.giftFilter==='pending'?' on':'')+'" data-gf="pending">لسه</button><button class="chip'+(ui.giftFilter==='all'?' on':'')+'" data-gf="all">الكل</button></div>';
  h+='<div class="list">'+(list.length?list.map(k=>'<div class="row"><button class="att-row'+(k.giftDone?' on':'')+'" style="background:none;border:0;padding:0;cursor:pointer" data-gift="'+k.id+'" aria-label="اتسلمت"><span class="tick"></span></button><div class="main" data-kid="'+k.id+'"><div class="name">'+esc(k.name)+'</div><div class="meta">'+[k.giftSize?'مقاس '+k.giftSize:'',k.giftNotes,k.servantId?'مع '+servantName(k.servantId):''].filter(Boolean).map(esc).join(' · ')+'</div></div><span class="pill new">'+gradeTxt(k.grade)+'</span></div>').join(''):'<div class="empty">كل الهدايا اتسلمت.</div>')+'</div>';
  if(done&&me.isOwner)h+='<button class="btn sm line" style="margin-top:12px" data-act="resetGifts">ابدأ موسم هدايا جديد (شيل كل العلامات)</button>';
  return h;
}

  h+='<fieldset><legend>حسابك</legend><div class="small">داخل بـ <span dir="ltr">'+esc(me.user.email)+'</span>'+(me.isOwner?' · <b>المسؤول</b>':'')+'</div><div class="btns"><button class="btn line" data-act="logout">خروج</button></div></fieldset></div>';
  after=()=>{const f=$('#setForm');if(f)f.onsubmit=e=>{e.preventDefault();
    setDoc(doc(db,'settings','main'),{church:$('#s_church').value.trim(),service:$('#s_service').value.trim()||'خدمة خامسة وسادسة',weekday:+$('#s_weekday').value,threshold:+$('#s_threshold').value},{merge:true}).then(()=>toast('اتحفظ'),fail);ui.attDate=null;document.activeElement.blur()}};

/* ---------- sheets ---------- */
function sheet(html,onMount){$('#sheetRoot').innerHTML='<div class="sheet-bg" id="sbg"><div class="sheet" role="dialog" aria-modal="true">'+html+'</div></div>';$('#sbg').onclick=e=>{if(e.target.id==='sbg')closeSheet()};onMount&&onMount()}
function closeSheet(){$('#sheetRoot').innerHTML='';if(pending)render()}
function confirmSheet(msg,yes,fn,danger){sheet('<h2>'+msg+'</h2><div class="btns"><button class="btn '+(danger?'danger':'')+'" id="cYes">'+yes+'</button><button class="btn line" id="cNo">لا، رجوع</button></div>',()=>{$('#cYes').onclick=()=>{closeSheet();fn()};$('#cNo').onclick=closeSheet})}
function visitSheet(kidId){
  const k=kidById(kidId);if(!k)return;
  const def=me.servantId||k.servantId;
  sheet('<h2>افتقاد: '+esc(k.name)+'</h2><form class="f" id="vForm"><div class="two"><label>التاريخ<input type="date" id="v_date" value="'+todayISO()+'"></label><label>النوع<select id="v_type">'+VISIT_TYPES.map(t=>'<option>'+t+'</option>').join('')+'</select></label></div>'+
   '<label>مين اللي افتقد<select id="v_sv"><option value="">—</option>'+S.servants.map(s=>'<option value="'+s.id+'"'+(s.id===def?' selected':'')+'>'+esc(s.name)+'</option>').join('')+'</select></label>'+
   '<label>إيه اللي حصل<textarea id="v_note" rows="3" placeholder="مثلاً: كان عنده امتحانات، هييجي الجمعة الجاية"></textarea></label><div class="btns"><button class="btn" type="submit">سجّل</button><button class="btn line" type="button" id="vCancel">إلغاء</button></div></form>',()=>{
    $('#vCancel').onclick=closeSheet;
    $('#vForm').onsubmit=e=>{e.preventDefault();
      setDoc(doc(db,'visits',newId('visits')),{kidId,date:$('#v_date').value||todayISO(),type:$('#v_type').value,servantId:$('#v_sv').value,note:$('#v_note').value.trim(),by:me.user.email,byName:me.user.displayName||''}).catch(fail);
      closeSheet();toast('اتسجل الافتقاد');render()};
  });
}

/* ---------- actions ---------- */
let tt;function toast(m){clearTimeout(tt);let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';t.className='toast';t.setAttribute('role','status');document.body.appendChild(t)}t.textContent=m;t.hidden=false;tt=setTimeout(()=>t.hidden=true,2200)}
function download(name,data,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
function snapshotJSON(){return JSON.stringify({v:1,settings:{...S.settings},servants:S.servants.map(({id,name,phone,email})=>({id,name,phone,email})),kids:S.kids,sessions:S.sessions,visits:S.visits})}
function doCSV(){
  const cols=[['الاسم','name'],['السنة',k=>gradeTxt(k.grade)],['تاريخ الميلاد','birth'],['الخادم',k=>servantName(k.servantId)],['الحالة',k=>STATUS_TXT[kidStats(k).status]],['نسبة الحضور %',k=>kidStats(k).rate??''],['آخر حضور',k=>kidStats(k).last||''],['اسم الأب','fatherName'],['تليفون الأب','fatherPhone'],['اسم الأم','motherName'],['تليفون الأم','motherPhone'],['تليفون الولد','phone'],['المنطقة','area'],['العنوان','address'],['علامة مميزة','landmark'],['المدرسة','school'],['الفصل','schoolClass'],['أب الاعتراف','confessor'],['مقاس الهدية','giftSize'],['الهدية - ملاحظات','giftNotes'],['الهدية اتسلمت',k=>k.giftDone?'نعم':'لا'],['ملاحظات','notes']];
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const rows=[cols.map(c=>q(c[0])).join(',')].concat(S.kids.map(k=>cols.map(([_,f])=>q(typeof f==='function'?f(k):k[f])).join(',')));
  download('khedma-'+todayISO()+'.csv','﻿'+rows.join('\r\n'),'text/csv;charset=utf-8');
}
async function commitMany(ops){
  for(let i=0;i<ops.length;i+=400){const b=writeBatch(db);ops.slice(i,i+400).forEach(fn=>fn(b));await b.commit()}
}
function importData(o){
  if(!o||!Array.isArray(o.kids)||typeof o.sessions!=='object'){toast('الملف ده مش نسخة احتياطية من الموقع');return}
  confirmSheet('هتضيف '+o.kids.length+' ولد و'+(o.servants||[]).length+' خادم من النسخة دي للداتا الأونلاين؟','أيوه ضيف',async()=>{
    toast('بيرفع…');const ops=[];const clean=s=>String(s).replace(/\//g,'_');
    (o.servants||[]).forEach(s=>{const id=clean(s.id);const email=low(s.email);ops.push(b=>b.set(doc(db,'servants',id),{name:s.name||'',phone:s.phone||'',email}));if(email)ops.push(b=>b.set(doc(db,'members',email),{servantId:id,name:s.name||''}))});
    o.kids.forEach(k=>{const {id,...rest}=k;ops.push(b=>b.set(doc(db,'kids',clean(id)),rest))});
    Object.entries(o.sessions).forEach(([d,ids])=>{const arr=Array.isArray(ids)?ids:(ids&&ids.present)||[];ops.push(b=>b.set(doc(db,'sessions',d),{present:arrayUnion(...arr.map(clean))},{merge:true}))});
    (o.visits||[]).forEach(v=>{const {id,...rest}=v;ops.push(b=>b.set(doc(db,'visits',clean(id)),rest))});
    try{await commitMany(ops);toast('اترفعت الداتا');go('home')}catch(e){fail(e)}
  });
}
function resizeLogo(file){
  const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const n=256,c=document.createElement('canvas');c.width=c.height=n;const x=c.getContext('2d');const s=Math.min(img.width,img.height);x.fillStyle='#fff';x.fillRect(0,0,n,n);x.drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,n,n);
    setDoc(doc(db,'settings','main'),{logo:c.toDataURL('image/jpeg',.85)},{merge:true}).then(()=>toast('اتغير اللوجو'),fail)};img.onerror=()=>toast('الصورة دي مش راضية تفتح');img.src=r.result};r.readAsDataURL(file);
}

document.addEventListener('click',e=>{
  if(!me.user)return;
  const t=e.target.closest('[data-go],[data-kid],[data-act],[data-filter],[data-att],[data-visit],[data-servant],[data-copy],[data-delvisit],[data-unassign],[data-gift],[data-gf]');
  if(!t)return;const d=t.dataset;
  if(d.visit){e.stopPropagation();visitSheet(d.visit);return}
  if(d.copy){navigator.clipboard.writeText(d.copy).then(()=>toast('اتنسخ الرقم'),()=>toast(d.copy));return}
  if(d.unassign){updateDoc(doc(db,'kids',d.unassign),{servantId:''}).catch(fail);return}
  if(d.delvisit){confirmSheet('تمسح الافتقاد ده؟','امسح',()=>deleteDoc(doc(db,'visits',d.delvisit)).catch(fail),true);return}
  if(d.gift){const k=kidById(d.gift);updateDoc(doc(db,'kids',k.id),{giftDone:!k.giftDone}).catch(fail);return}
  if(d.gf){ui.giftFilter=d.gf;render();return}
  if(d.att){const date=ui.attDate;const on=!t.classList.contains('on');
    t.classList.toggle('on',on);t.setAttribute('aria-pressed',on);
    setDoc(doc(db,'sessions',date),{present:on?arrayUnion(d.att):arrayRemove(d.att)},{merge:true}).catch(e=>{t.classList.toggle('on',!on);fail(e)});return}
  if(d.go){ui.q='';if(d.go==='kids')ui.filter=null;go(d.go);return}
  if(d.kid){go('kid',{kidId:d.kid});return}
  if(d.servant){go('servant',{servantId:d.servant});return}
  if(d.filter){ui.q='';go('kids',{filter:d.filter});return}
  const A={
    newKid:()=>go('kidEdit',{editId:'new'}),
    editKid:()=>go('kidEdit',{editId:ui.kidId}),
    cancelEdit:()=>ui.editId==='new'?go('kids'):go('kid',{kidId:ui.editId}),
    delKid:()=>{const k=kidById(ui.kidId);confirmSheet('تمسح '+esc(k.name)+' وكل الحضور والافتقاد بتوعه؟','امسح',async()=>{
      const ops=[b=>b.delete(doc(db,'kids',k.id))];
      S.visits.filter(v=>v.kidId===k.id).forEach(v=>ops.push(b=>b.delete(doc(db,'visits',v.id))));
      Object.keys(S.sessions).filter(dt=>S.sessions[dt].includes(k.id)).forEach(dt=>ops.push(b=>b.update(doc(db,'sessions',dt),{present:arrayRemove(k.id)})));
      go('kids');try{await commitMany(ops)}catch(e){fail(e)}},true)},
    delServant:()=>{const sv=S.servants.find(s=>s.id===ui.servantId);confirmSheet('تمسح '+esc(sv.name)+'؟ الأولاد اللي معاه هيبقوا من غير خادم'+(sv.email?' ومش هيقدر يدخل الموقع تاني':'')+'.','امسح',async()=>{
      const ops=[b=>b.delete(doc(db,'servants',sv.id))];if(sv.email)ops.push(b=>b.delete(doc(db,'members',sv.email)));
      S.kids.filter(k=>k.servantId===sv.id).forEach(k=>ops.push(b=>b.update(doc(db,'kids',k.id),{servantId:''})));
      go('servants');try{await commitMany(ops)}catch(e){fail(e)}},true)},
    assignKid:()=>{const id=$('#addKid').value;if(!id)return;updateDoc(doc(db,'kids',id),{servantId:ui.servantId}).catch(fail)},
    autoAssign:async()=>{const cnt={};S.servants.forEach(s=>cnt[s.id]=S.kids.filter(k=>k.servantId===s.id).length);const ops=[];
      S.kids.filter(k=>!k.servantId).forEach(k=>{const s=S.servants.reduce((a,b)=>cnt[a.id]<=cnt[b.id]?a:b);cnt[s.id]++;ops.push(b=>b.update(doc(db,'kids',k.id),{servantId:s.id}))});
      try{await commitMany(ops);toast('اتوزعوا')}catch(e){fail(e)}},
    allPresent:()=>setDoc(doc(db,'sessions',ui.attDate),{present:S.kids.map(k=>k.id)}).catch(fail),
    delSession:()=>confirmSheet('تمسح حضور '+esc(fmtDate(ui.attDate))+'؟','امسح',()=>deleteDoc(doc(db,'sessions',ui.attDate)).catch(fail),true),
    csv:doCSV,
    backup:()=>download('khedma-backup-'+todayISO()+'.json',snapshotJSON(),'application/json'),
    pickImport:()=>$('#importFile').click(),
    pickLogo:()=>$('#logoFile').click(),
    rmLogo:()=>setDoc(doc(db,'settings','main'),{logo:null},{merge:true}).catch(fail),
    resetGifts:()=>confirmSheet('تشيل علامة "اتسلمت" من كل الأولاد؟','أيوه',()=>commitMany(S.kids.filter(k=>k.giftDone).map(k=>b=>b.update(doc(db,'kids',k.id),{giftDone:false}))).catch(fail)),
    logout:()=>signOut(auth),
  };
  if(d.act&&A[d.act])A[d.act]();
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('.row[tabindex]'))e.target.click();if(e.key==='Escape')closeSheet()});
$('#importFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{importData(JSON.parse(r.result))}catch(err){toast('الملف ده مش نسخة احتياطية من الموقع')}};r.readAsText(f);e.target.value=''};
$('#logoFile').onchange=e=>{const f=e.target.files[0];if(f)resizeLogo(f);e.target.value=''};

/* ---------- auth + data ---------- */
let unsubs=[];
function stopAll(){unsubs.forEach(u=>u());unsubs=[];Object.assign(S,{servants:[],kids:[],sessions:{},visits:[],loaded:{}});S.settings={...DEFAULT_SETTINGS}}
function loginScreen(msg){
  screen('<div class="gate"><div class="logo big">'+logoHTML()+'</div><h2>'+esc(S.settings.service)+'</h2><p class="muted">'+(msg||'ادخل بحساب جوجل اللي المسؤول سجّله ليك.')+'</p><button class="btn" id="gLogin">ادخل بحساب جوجل</button></div>');
  $('#gLogin').onclick=async()=>{const p=new GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});
    try{await signInWithPopup(auth,p)}catch(e){if(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment')signInWithRedirect(auth,p);else if(e.code!=='auth/popup-closed-by-user'&&e.code!=='auth/cancelled-popup-request')toast(e.code==='auth/unauthorized-domain'?'لازم تضيف رابط الموقع في Authorized domains في Firebase':'الدخول ما نجحش، جرّب تاني')}};
}
function waitingScreen(){
  screen('<div class="gate"><div class="logo big">'+logoHTML()+'</div><h2>مستني الموافقة</h2><p class="muted">الإيميل ده لسه مش متسجل في الخدمة:</p><p dir="ltr" class="n"><b>'+esc(me.user.email)+'</b></p><p class="muted">ابعته للمسؤول يضيفك في صفحة الخدام، وبعدين افتح الصفحة تاني.</p><div class="btns" style="justify-content:center"><button class="btn" onclick="location.reload()">جرّب تاني</button><button class="btn line" id="lo">خروج بحساب تاني</button></div></div>');
  $('#lo').onclick=()=>signOut(auth);
}
function claimScreen(){
  screen('<div class="gate"><div class="logo big">'+logoHTML()+'</div><h2>أهلاً '+esc(me.user.displayName||'')+'</h2><p class="muted">لسه محدش مسؤول عن الموقع ده. لو أنت أمين الخدمة، خلي حسابك هو المسؤول. المسؤول بس هو اللي يضيف الخدام ويمسح البيانات.</p><button class="btn" id="claim">أنا المسؤول</button><button class="btn line" id="lo" style="margin-top:8px">خروج</button></div>');
  $('#claim').onclick=()=>setDoc(doc(db,'meta','owner'),{uid:me.user.uid,email:low(me.user.email)}).then(start,fail);
  $('#lo').onclick=()=>signOut(auth);
}
async function start(){
  screen('<div class="gate"><p class="muted">بيحمّل…</p></div>');
  let owner=null;
  try{const o=await getDoc(doc(db,'meta','owner'));owner=o.exists()?o.data():null}catch(e){owner=undefined}
  if(owner===null)return claimScreen();
  me.isOwner=!!owner&&owner.uid===me.user.uid;
  let denied=false;
  const onErr=e=>{if(e.code==='permission-denied'&&!denied){denied=true;stopAll();waitingScreen()}else if(e.code!=='permission-denied')console.error(e)};
  const ready=()=>['kids','servants','sessions','visits','settings'].every(k=>S.loaded[k]);
  const sub=(name,fn)=>unsubs.push(onSnapshot(name==='settings'?doc(db,'settings','main'):collection(db,name),snap=>{fn(snap);S.loaded[name]=true;if(ready()){me.servantId=(S.servants.find(s=>s.email&&s.email===low(me.user.email))||{}).id||null;scheduleRender()}},onErr));
  sub('kids',s=>{S.kids=s.docs.map(d=>({id:d.id,...d.data()}))});
  sub('servants',s=>{S.servants=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.name.localeCompare(b.name,'ar'))});
  sub('sessions',s=>{const o={};s.docs.forEach(d=>{o[d.id]=d.data().present||[]});S.sessions=o});
  sub('visits',s=>{S.visits=s.docs.map(d=>({id:d.id,...d.data()}))});
  sub('settings',s=>{S.settings={...DEFAULT_SETTINGS,...(s.exists()?s.data():{})}});
}

if(!FIREBASE_CONFIG){
  screen('<div class="gate"><div class="logo big">'+logoHTML()+'</div><h2>محتاج إعداد Firebase</h2><p class="muted">الملف ده لسه ماتحطش فيه بيانات مشروع Firebase. ابعت الـ firebaseConfig لـ Claude يحطها، أو حطها بنفسك في أول السكريبت مكان FIREBASE_CONFIG.</p></div>');
}else{
  app=initializeApp(FIREBASE_CONFIG);
  auth=getAuth(app);
  try{db=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})})}catch(e){db=initializeFirestore(app,{})}
  getRedirectResult(auth).catch(()=>{});
  onAuthStateChanged(auth,u=>{stopAll();me.user=u;me.isOwner=false;me.servantId=null;ui.view='home';ui.filter=null;if(!u)loginScreen();else start()});
}

</script>
</body>
</html>
